<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Combien de repas par jour selon l'âge : un chaton mange 3 à 4 petits repas par jour, un chat adulte au moins 2 repas ou plusieurs petits repas, et laisser à volonté expose au surpoids sauf distributeur qui rationne.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .k{font-weight:800;font-size:26px;fill:#fff;}
      .h{font-weight:800;font-size:19px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:15px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Combien de repas par jour ?</text>

  <g class="s" transform="translate(180,160)"><circle cx="0" cy="0" r="54" fill="url(#ic)"/><text class="t k" x="0" y="9" text-anchor="middle">3-4</text><text class="t h" x="0" y="90" text-anchor="middle">Chaton</text><text class="t d" x="0" y="114" text-anchor="middle">Petits repas fréquents</text></g>
  <g class="s b" transform="translate(500,160)"><circle cx="0" cy="0" r="54" fill="url(#ic)"/><text class="t k" x="0" y="9" text-anchor="middle">2+</text><text class="t h" x="0" y="90" text-anchor="middle">Adulte</text><text class="t d" x="0" y="114" text-anchor="middle">2 repas ou plusieurs petits</text></g>
  <g class="s c" transform="translate(820,160)"><circle cx="0" cy="0" r="54" fill="#c98a4b"/><text class="t k" x="0" y="4" text-anchor="middle" font-size="18">à volonté</text><text class="t h" x="0" y="90" text-anchor="middle">Prudence</text><text class="t d" x="0" y="114" text-anchor="middle">Risque de surpoids</text></g>

  <text class="t" x="880" y="306" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
