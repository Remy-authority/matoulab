<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="La règle : un bac par chat, plus un. Un chat : deux bacs. Deux chats : trois bacs.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:34px;fill:#21232b;}
      .lbl{font-weight:700;font-size:26px;fill:#4a2fa8;}
      .eq{font-weight:800;font-size:40px;fill:#c98a4b;}
      /* Animation d'apparition douce, désactivée si l'utilisateur préfère moins d'animation. */
      @keyframes pop { from { opacity:0; } to { opacity:1; } }
      /* Contenu visible par défaut ; animation seulement si supportée + souhaitée. */
      @media (prefers-reduced-motion: no-preference){
        .anim { opacity:0; animation: pop .5s ease forwards; }
        .d1{animation-delay:.15s}.d2{animation-delay:.30s}.d3{animation-delay:.45s}
        .d4{animation-delay:.60s}.d5{animation-delay:.75s}.d6{animation-delay:.90s}
      }
    </style>
    <g id="cat">
      <path d="M8 14 L8 34 L22 20 Z M52 14 L52 34 L38 20 Z" fill="#7c5cff"/>
      <circle cx="30" cy="36" r="20" fill="#7c5cff"/>
      <circle cx="23" cy="33" r="3" fill="#fff"/><circle cx="37" cy="33" r="3" fill="#fff"/>
      <path d="M30 39 l4 3.5 a4 4 0 0 1 -8 0 Z" fill="#ff8fab"/>
    </g>
    <g id="box">
      <rect x="4" y="20" width="56" height="34" rx="6" fill="#fff" stroke="#6d4bd6" stroke-width="3"/>
      <rect x="10" y="30" width="44" height="18" rx="4" fill="#efeaff"/>
    </g>
  </defs>

  <rect width="1000" height="460" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="60" text-anchor="middle">La règle : un bac par chat, plus un</text>

  <!-- 1 chat -> 2 bacs -->
  <g transform="translate(120,120)">
    <use href="#cat"/>
    <text class="t lbl" x="30" y="90" text-anchor="middle">1 chat</text>
  </g>
  <text class="t eq" x="300" y="165" text-anchor="middle">=</text>
  <g class="anim d2" transform="translate(380,120)"><use href="#box"/></g>
  <g class="anim d3" transform="translate(470,120)"><use href="#box"/></g>
  <text class="t lbl" x="510" y="210" text-anchor="middle">2 bacs</text>

  <!-- 2 chats -> 3 bacs -->
  <g transform="translate(90,290)"><use href="#cat"/></g>
  <g transform="translate(150,290)"><use href="#cat"/></g>
  <text class="t lbl" x="150" y="380" text-anchor="middle">2 chats</text>
  <text class="t eq" x="300" y="335" text-anchor="middle">=</text>
  <g class="anim d4" transform="translate(380,290)"><use href="#box"/></g>
  <g class="anim d5" transform="translate(470,290)"><use href="#box"/></g>
  <g class="anim d6" transform="translate(560,290)"><use href="#box"/></g>
  <text class="t lbl" x="510" y="380" text-anchor="middle">3 bacs</text>

  <text class="t" x="780" y="250" font-size="20" fill="#6a7180">matoulab.com</text>
</svg>
