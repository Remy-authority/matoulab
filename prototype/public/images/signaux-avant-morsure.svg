<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Les signaux qui précèdent la morsure pendant les câlins : la queue qui fouette ou tape, les oreilles qui pivotent en arrière, la peau du dos qui frémit, et le chat qui se fige ou cesse de ronronner. Ce sont des signaux d'arrêt.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .h{font-weight:800;font-size:20px;fill:#21232b;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.15s}.c{animation-delay:.3s}.e{animation-delay:.45s}}
    </style>
  </defs>
  <rect width="1000" height="430" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Les signaux juste avant la morsure</text>

  <g class="s">
    <rect x="60" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="115" cy="146" r="14" fill="url(#dot)"/>
    <text class="t h" x="150" y="140">La queue fouette</text><text class="t d" x="150" y="170">Battements amples et rapides</text>
  </g>
  <g class="s b">
    <rect x="520" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="575" cy="146" r="14" fill="url(#dot)"/>
    <text class="t h" x="610" y="140">Oreilles en arrière</text><text class="t d" x="610" y="170">Pivotées sur les côtés ou plaquées</text>
  </g>
  <g class="s c">
    <rect x="60" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="115" cy="284" r="14" fill="url(#dot)"/>
    <text class="t h" x="150" y="278">La peau du dos frémit</text><text class="t d" x="150" y="308">Petits tressaillements le long du dos</text>
  </g>
  <g class="s e">
    <rect x="520" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="575" cy="284" r="14" fill="url(#dot)"/>
    <text class="t h" x="610" y="278">Il se fige</text><text class="t d" x="610" y="308">Se raidit ou cesse de ronronner</text>
  </g>

  <text class="t d" x="500" y="392" text-anchor="middle" fill="#8b6b3f">Ces signaux disent stop : on arrête la caresse avant la morsure.</text>
  <text class="t" x="500" y="416" font-size="15" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
