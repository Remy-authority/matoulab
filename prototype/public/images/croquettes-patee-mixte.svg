<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Trois façons de nourrir son chat : les croquettes, pratiques et économiques ; la pâtée, riche en eau et très appétente ; l'alimentation mixte, qui combine les avantages des deux.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .h{font-weight:800;font-size:20px;fill:#fff;}
      .d{font-weight:500;font-size:15px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Croquettes, pâtée ou mixte ?</text>

  <g class="s" transform="translate(180,160)"><circle cx="0" cy="0" r="52" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle">Croquettes</text><text class="t d" x="0" y="88" text-anchor="middle">Pratiques,</text><text class="t d" x="0" y="110" text-anchor="middle">économiques</text></g>
  <g class="s b" transform="translate(500,160)"><circle cx="0" cy="0" r="52" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle">Pâtée</text><text class="t d" x="0" y="88" text-anchor="middle">Riche en eau,</text><text class="t d" x="0" y="110" text-anchor="middle">très appétente</text></g>
  <g class="s c" transform="translate(820,160)"><circle cx="0" cy="0" r="52" fill="#c98a4b"/><text class="t h" x="0" y="6" text-anchor="middle">Mixte</text><text class="t d" x="0" y="88" text-anchor="middle">Le meilleur</text><text class="t d" x="0" y="110" text-anchor="middle">des deux</text></g>

  <text class="t" x="880" y="306" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
