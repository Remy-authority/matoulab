<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="La transition alimentaire en 7 jours : jours 1 et 2 un quart de nouvelle nourriture, jours 3 et 4 la moitié, jours 5 et 6 les trois quarts, jour 7 cent pour cent de la nouvelle nourriture. On augmente sa part petit à petit.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b14bd6"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .pct{font-weight:800;font-size:22px;fill:#4a2fa8;}
      .h{font-weight:700;font-size:17px;fill:#21232b;}
      .d{font-weight:500;font-size:14px;fill:#5a616e;}
      .bowl{fill:#efeaff;stroke:#c9b8f5;stroke-width:2;}
      @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      @media (prefers-reduced-motion: no-preference){.f{transform-origin:bottom;animation:rise .7s ease forwards}.b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}}
    </style>
  </defs>
  <rect width="1000" height="330" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">La transition alimentaire en 7 jours</text>

  <g transform="translate(150,0)"><ellipse class="bowl" cx="0" cy="230" rx="66" ry="18"/><clipPath id="c1"><ellipse cx="0" cy="230" rx="62" ry="46"/></clipPath><g clip-path="url(#c1)"><rect class="f" x="-62" y="214" width="124" height="16" fill="url(#fill)"/></g><text class="pct" x="0" y="120" text-anchor="middle">25%</text><text class="h" x="0" y="272" text-anchor="middle">Jours 1-2</text><text class="d" x="0" y="294" text-anchor="middle">Un quart nouveau</text></g>
  <g transform="translate(390,0)"><ellipse class="bowl" cx="0" cy="230" rx="66" ry="18"/><clipPath id="c2"><ellipse cx="0" cy="230" rx="62" ry="46"/></clipPath><g clip-path="url(#c2)"><rect class="f b2" x="-62" y="198" width="124" height="32" fill="url(#fill)"/></g><text class="pct" x="0" y="120" text-anchor="middle">50%</text><text class="h" x="0" y="272" text-anchor="middle">Jours 3-4</text><text class="d" x="0" y="294" text-anchor="middle">Moitié-moitié</text></g>
  <g transform="translate(630,0)"><ellipse class="bowl" cx="0" cy="230" rx="66" ry="18"/><clipPath id="c3"><ellipse cx="0" cy="230" rx="62" ry="46"/></clipPath><g clip-path="url(#c3)"><rect class="f b3" x="-62" y="182" width="124" height="48" fill="url(#fill)"/></g><text class="pct" x="0" y="120" text-anchor="middle">75%</text><text class="h" x="0" y="272" text-anchor="middle">Jours 5-6</text><text class="d" x="0" y="294" text-anchor="middle">Trois quarts</text></g>
  <g transform="translate(870,0)"><ellipse class="bowl" cx="0" cy="230" rx="66" ry="18"/><clipPath id="c4"><ellipse cx="0" cy="230" rx="62" ry="46"/></clipPath><g clip-path="url(#c4)"><rect class="f b4" x="-62" y="168" width="124" height="62" fill="url(#fill)"/></g><text class="pct" x="0" y="120" text-anchor="middle">100%</text><text class="h" x="0" y="272" text-anchor="middle">Jour 7</text><text class="d" x="0" y="294" text-anchor="middle">Nouvelle nourriture</text></g>

  <text class="t" x="500" y="316" font-size="14" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
