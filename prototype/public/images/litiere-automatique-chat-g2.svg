<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="L'introduire sans le braquer"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient><linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient><style>.t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:29px;fill:#21232b}.h{font-weight:800;font-size:19px;fill:#21232b}.d{font-weight:500;font-size:16px;fill:#5a616e}@keyframes pop{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:no-preference){.s{opacity:0;animation:pop .5s ease forwards}}</style></defs><rect width="1000" height="400" rx="24" fill="url(#bg)"/><text class="t title" x="500" y="52" text-anchor="middle">L'introduire sans le braquer</text><g class="s"><rect x="60" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="120" cy="146" r="22" fill="url(#dot)"/><path d="M110 146 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="160" y="140">Éteinte d'abord</text><text class="t d" x="160" y="170">utilisée comme un bac simple</text></g><g class="s"><rect x="520" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="580" cy="146" r="22" fill="url(#dot)"/><path d="M570 146 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="620" y="140">Même litière</text><text class="t d" x="620" y="170">celle qu'il connaît déjà</text></g><g class="s"><rect x="60" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="120" cy="284" r="22" fill="url(#dot)"/><path d="M110 284 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="160" y="278">Ancien bac</text><text class="t d" x="160" y="308">gardé à côté quelque temps</text></g><g class="s"><rect x="520" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="580" cy="284" r="22" fill="url(#dot)"/><path d="M570 284 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="620" y="278">Mise en route</text><text class="t d" x="620" y="308">en son absence, sans surprise</text></g><text class="t" x="880" y="384" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text></svg>