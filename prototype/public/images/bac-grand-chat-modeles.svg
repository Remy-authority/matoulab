<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Trois modèles de bac adaptés à un grand chat : le bac XXL ou maxi le plus simple, le bac à rebords hauts contre les débordements, et l'astuce du bac de rangement en plastique très spacieux et peu cher avec une entrée découpée. Bac ouvert de préférence.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:30px;fill:#21232b;}
      .h{font-weight:800;font-size:20px;fill:#21232b;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      .box{fill:none;stroke:#6d4bd6;stroke-width:4;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){
        .s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}
      }
    </style>
  </defs>
  <rect width="1000" height="360" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="54" text-anchor="middle">3 bacs qui conviennent aux grands chats</text>

  <g class="s" transform="translate(180,150)">
    <rect class="box" x="-56" y="-24" width="112" height="60" rx="8"/>
    <rect x="-46" y="-8" width="92" height="34" rx="4" fill="#efeaff"/>
    <text class="t h" x="0" y="78" text-anchor="middle">XXL / maxi</text>
    <text class="t d" x="0" y="106" text-anchor="middle">Le choix le plus simple</text>
  </g>
  <g class="s b" transform="translate(500,150)">
    <path class="box" d="M-56 40 L-56 -30 M56 40 L56 -30 M-56 40 L56 40"/>
    <rect x="-46" y="6" width="92" height="30" rx="4" fill="#efeaff"/>
    <text class="t h" x="0" y="78" text-anchor="middle">Rebords hauts</text>
    <text class="t d" x="0" y="106" text-anchor="middle">Contre les débordements</text>
  </g>
  <g class="s c" transform="translate(820,150)">
    <path class="box" d="M-56 40 L-56 -30 L-20 -30 M-20 -30 L-20 -6 L56 -6 M56 -6 L56 40 L-56 40"/>
    <rect x="-46" y="10" width="92" height="26" rx="4" fill="#efeaff"/>
    <text class="t h" x="0" y="78" text-anchor="middle">Bac de rangement</text>
    <text class="t d" x="0" y="106" text-anchor="middle">Spacieux, pas cher, entrée basse</text>
  </g>

  <text class="t d" x="500" y="312" text-anchor="middle" fill="#8b6b3f">Bac ouvert de préférence : les modèles fermés restent vite exigus.</text>
  <text class="t" x="500" y="340" font-size="16" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
