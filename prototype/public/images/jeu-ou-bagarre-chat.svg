<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Jeu ou vraie bagarre entre deux chats. C'est du jeu si c'est silencieux, les rôles s'alternent (chacun poursuit à son tour), les griffes restent rentrées et ils reprennent une activité normale ensuite. C'est une bagarre si on entend des feulements et des cris, les oreilles sont plaquées et les poils hérissés, et l'un des deux fuit ou se cache.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fbf6"/><stop offset="1" stop-color="#fdf6f4"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .ch{font-weight:800;font-size:22px;fill:#fff;}
      .d{font-weight:600;font-size:16px;fill:#3a3f4a;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.r{animation-delay:.2s}}
    </style>
  </defs>
  <rect width="1000" height="430" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="50" text-anchor="middle">Jeu ou vraie bagarre ?</text>

  <g class="s">
    <rect x="60" y="78" width="400" height="316" rx="18" fill="#fff" stroke="#d8ecd9" stroke-width="2"/>
    <rect x="60" y="78" width="400" height="52" rx="18" fill="#4e9a5c"/>
    <text class="t ch" x="260" y="112" text-anchor="middle">C'est du jeu</text>
    <text class="t d" x="90" y="168">C'est silencieux</text>
    <text class="t d" x="90" y="210">Les rôles s'alternent</text>
    <text class="t d" x="90" y="252">Griffes rentrées, pas de blessure</text>
    <text class="t d" x="90" y="294">Ils reprennent une vie normale</text>
  </g>
  <g class="s r">
    <rect x="540" y="78" width="400" height="316" rx="18" fill="#fff" stroke="#f2dcdc" stroke-width="2"/>
    <rect x="540" y="78" width="400" height="52" rx="18" fill="#d9645f"/>
    <text class="t ch" x="740" y="112" text-anchor="middle">C'est une bagarre</text>
    <text class="t d" x="570" y="168">Feulements et cris</text>
    <text class="t d" x="570" y="210">Oreilles plaquées, poils hérissés</text>
    <text class="t d" x="570" y="252">L'un domine, l'autre fuit</text>
    <text class="t d" x="570" y="294">Griffures ou morsures possibles</text>
  </g>

  <text class="t" x="880" y="418" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
