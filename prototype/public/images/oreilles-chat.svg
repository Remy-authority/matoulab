<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Les oreilles du chat en 3 signaux : droites et vers l'avant le chat est attentif et détendu, pivotées sur les côtés en oreilles d'avion il est nerveux ou tendu, plaquées en arrière c'est la peur ou l'agressivité défensive.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:30px;fill:#21232b;}
      .h{font-weight:800;font-size:20px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      .head{fill:#efeaff;stroke:#7c5cff;stroke-width:3;}
      .ear{fill:#7c5cff;}
      .eye{fill:#4a2fa8;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){
        .s{opacity:0;animation:pop .5s ease forwards}
        .b{animation-delay:.2s}.c{animation-delay:.4s}
      }
    </style>
  </defs>
  <rect width="1000" height="380" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Les oreilles du chat en 3 signaux</text>

  <!-- 1 droites vers l'avant -->
  <g class="s" transform="translate(180,150)">
    <path class="ear" d="M-42 -18 L-14 -22 L-30 -70 Z"/>
    <path class="ear" d="M42 -18 L14 -22 L30 -70 Z"/>
    <circle class="head" cx="0" cy="6" r="46"/>
    <circle class="eye" cx="-16" cy="2" r="5"/><circle class="eye" cx="16" cy="2" r="5"/>
    <text class="t h" x="0" y="118" text-anchor="middle">Droites, vers l'avant</text>
    <text class="t d" x="0" y="146" text-anchor="middle">Attentif, curieux, détendu</text>
  </g>

  <!-- 2 oreilles d'avion -->
  <g class="s b" transform="translate(500,150)">
    <path class="ear" d="M-40 -30 L-30 -6 L-78 -18 Z"/>
    <path class="ear" d="M40 -30 L30 -6 L78 -18 Z"/>
    <circle class="head" cx="0" cy="6" r="46"/>
    <circle class="eye" cx="-16" cy="2" r="5"/><circle class="eye" cx="16" cy="2" r="5"/>
    <text class="t h" x="0" y="118" text-anchor="middle">Sur les côtés (« avion »)</text>
    <text class="t d" x="0" y="146" text-anchor="middle">Nervosité, tension</text>
  </g>

  <!-- 3 plaquées en arrière -->
  <g class="s c" transform="translate(820,150)">
    <path class="ear" d="M-34 -8 L-18 -20 L-58 -34 Z"/>
    <path class="ear" d="M34 -8 L18 -20 L58 -34 Z"/>
    <circle class="head" cx="0" cy="6" r="46"/>
    <circle class="eye" cx="-16" cy="2" r="5"/><circle class="eye" cx="16" cy="2" r="5"/>
    <text class="t h" x="0" y="118" text-anchor="middle">Plaquées en arrière</text>
    <text class="t d" x="0" y="146" text-anchor="middle">Peur, défense : on recule</text>
  </g>

  <text class="t" x="500" y="358" font-size="16" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
