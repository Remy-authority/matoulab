<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Chat qui refuse sa litière : trois familles de causes à examiner dans l'ordre. La santé d'abord, une douleur ou une cystite se vérifie chez le vétérinaire. Puis le bac, propreté, type, emplacement et taille. Enfin le stress, changement, conflit ou marquage.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .n{font-weight:800;font-size:26px;fill:#fff;}
      .h{font-weight:800;font-size:20px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:15px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}}
    </style>
  </defs>
  <rect width="1000" height="340" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Litière boudée : 3 causes à examiner</text>

  <g class="s" transform="translate(180,160)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/><text class="t n" x="0" y="9" text-anchor="middle">1</text>
    <text class="t h" x="0" y="82" text-anchor="middle">La santé</text>
    <text class="t d" x="0" y="108" text-anchor="middle">Douleur, cystite :</text>
    <text class="t d" x="0" y="128" text-anchor="middle">on vérifie chez le véto</text>
  </g>
  <g class="s b" transform="translate(500,160)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/><text class="t n" x="0" y="9" text-anchor="middle">2</text>
    <text class="t h" x="0" y="82" text-anchor="middle">Le bac</text>
    <text class="t d" x="0" y="108" text-anchor="middle">Propreté, type,</text>
    <text class="t d" x="0" y="128" text-anchor="middle">emplacement, taille</text>
  </g>
  <g class="s c" transform="translate(820,160)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/><text class="t n" x="0" y="9" text-anchor="middle">3</text>
    <text class="t h" x="0" y="82" text-anchor="middle">Le stress</text>
    <text class="t d" x="0" y="108" text-anchor="middle">Changement, conflit,</text>
    <text class="t d" x="0" y="128" text-anchor="middle">marquage</text>
  </g>

  <text class="t d" x="500" y="316" text-anchor="middle" fill="#8b6b3f">Un arrêt soudain de propreté : on écarte d'abord une cause de santé.</text>
  <text class="t" x="915" y="330" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
