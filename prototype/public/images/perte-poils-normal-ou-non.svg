<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Perte de poils : normal ou à surveiller. Normal : perte diffuse sur tout le corps, plus forte au printemps et à l'automne, pelage qui reste beau. À surveiller chez le vétérinaire : plaques sans poils, démangeaisons, peau rouge ou croûtes, perte soudaine ou très abondante.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fbf6"/><stop offset="1" stop-color="#fdf6f4"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .ch{font-weight:800;font-size:21px;fill:#fff;}
      .d{font-weight:600;font-size:16px;fill:#3a3f4a;}
      .mk{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.r{animation-delay:.2s}}
    </style>
  </defs>
  <rect width="1000" height="360" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="50" text-anchor="middle">Perte de poils : normal ou à surveiller ?</text>

  <g class="s">
    <rect x="60" y="80" width="400" height="240" rx="18" fill="#fff" stroke="#d8ecd9" stroke-width="2"/>
    <rect x="60" y="80" width="400" height="52" rx="18" fill="#4e9a5c"/>
    <circle cx="104" cy="106" r="15" fill="#fff"/><path d="M96 106 l6 7 l12 -14" stroke="#4e9a5c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t ch" x="270" y="112" text-anchor="middle">Normal</text>
    <text class="t d" x="90" y="172">Perte diffuse sur tout le corps</text>
    <text class="t d" x="90" y="212">Plus forte au printemps / automne</text>
    <text class="t d" x="90" y="252">Le pelage reste beau et dense</text>
    <text class="t d" x="90" y="292">La peau est saine dessous</text>
  </g>
  <g class="s r">
    <rect x="540" y="80" width="400" height="240" rx="18" fill="#fff" stroke="#f2dcdc" stroke-width="2"/>
    <rect x="540" y="80" width="400" height="52" rx="18" fill="#d9645f"/>
    <circle cx="584" cy="106" r="15" fill="#fff"/><path class="mk" d="M577 99 l14 14 M591 99 l-14 14" stroke="#d9645f"/>
    <text class="t ch" x="750" y="112" text-anchor="middle">Véto conseillé</text>
    <text class="t d" x="570" y="172">Plaques sans poils</text>
    <text class="t d" x="570" y="212">Démangeaisons, peau rouge, croûtes</text>
    <text class="t d" x="570" y="252">Perte soudaine ou très abondante</text>
    <text class="t d" x="570" y="292">Le chat se gratte ou se lèche trop</text>
  </g>

  <text class="t" x="880" y="348" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
