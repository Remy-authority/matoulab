<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="L'audit du bac à litière en 5 points : la propreté, un bac nettoyé une à deux fois par jour ; le nombre, un bac par chat plus un ; l'emplacement, au calme et loin de la nourriture ; le type, une litière fine et non parfumée ; la taille, environ une fois et demie la longueur du chat.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .h{font-weight:800;font-size:19px;fill:#21232b;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      .chk{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .45s ease forwards}.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}.r5{animation-delay:.48s}}
    </style>
  </defs>
  <rect width="1000" height="420" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="50" text-anchor="middle">L'audit du bac en 5 points</text>

  <g class="s"><rect x="120" y="76" width="760" height="52" rx="14" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="158" cy="102" r="18" fill="url(#dot)"/><path class="chk" d="M150 102 l6 7 l12 -14"/><text class="t h" x="192" y="98">Propreté</text><text class="t d" x="192" y="118">Retirer les souillures 1 à 2 fois par jour</text></g>
  <g class="s r2"><rect x="120" y="140" width="760" height="52" rx="14" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="158" cy="166" r="18" fill="url(#dot)"/><path class="chk" d="M150 166 l6 7 l12 -14"/><text class="t h" x="192" y="162">Nombre</text><text class="t d" x="192" y="182">Un bac par chat, plus un</text></g>
  <g class="s r3"><rect x="120" y="204" width="760" height="52" rx="14" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="158" cy="230" r="18" fill="url(#dot)"/><path class="chk" d="M150 230 l6 7 l12 -14"/><text class="t h" x="192" y="226">Emplacement</text><text class="t d" x="192" y="246">Au calme, loin de la nourriture</text></g>
  <g class="s r4"><rect x="120" y="268" width="760" height="52" rx="14" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="158" cy="294" r="18" fill="url(#dot)"/><path class="chk" d="M150 294 l6 7 l12 -14"/><text class="t h" x="192" y="290">Type</text><text class="t d" x="192" y="310">Litière fine, non parfumée</text></g>
  <g class="s r5"><rect x="120" y="332" width="760" height="52" rx="14" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="158" cy="358" r="18" fill="url(#dot)"/><path class="chk" d="M150 358 l6 7 l12 -14"/><text class="t h" x="192" y="354">Taille</text><text class="t d" x="192" y="374">Environ 1,5 fois la longueur du chat</text></g>

  <text class="t" x="880" y="404" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
