<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="L'alimentation mixte, le bon compromis : la pâtée apporte l'eau et le plaisir, les croquettes la praticité et un support pour mâcher, et l'ensemble facilite le contrôle du poids. On respecte la ration totale sur la journée.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .h{font-weight:800;font-size:19px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:15px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Le mixte : le bon compromis</text>

  <g class="s" transform="translate(180,160)"><circle cx="0" cy="0" r="50" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Pâtée</text><text class="t d" x="0" y="86" text-anchor="middle">L'eau et le</text><text class="t d" x="0" y="108" text-anchor="middle">plaisir</text></g>
  <text class="t title" x="340" y="172" text-anchor="middle" fill="#c98a4b">+</text>
  <g class="s b" transform="translate(500,160)"><circle cx="0" cy="0" r="50" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Croq.</text><text class="t d" x="0" y="86" text-anchor="middle">La praticité,</text><text class="t d" x="0" y="108" text-anchor="middle">mâcher</text></g>
  <text class="t title" x="660" y="172" text-anchor="middle" fill="#c98a4b">=</text>
  <g class="s c" transform="translate(820,160)"><circle cx="0" cy="0" r="50" fill="#c98a4b"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Équilibre</text><text class="t d" x="0" y="86" text-anchor="middle">Hydratation</text><text class="t d" x="0" y="108" text-anchor="middle">+ contrôle poids</text></g>

  <text class="t d" x="500" y="300" text-anchor="middle" fill="#8b6b3f">On respecte la ration totale sur la journée.</text>
</svg>
