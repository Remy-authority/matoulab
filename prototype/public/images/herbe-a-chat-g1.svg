<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Ce que provoque l'herbe à chat"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient><linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient><style>.t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:29px;fill:#21232b}.h{font-weight:800;font-size:19px;fill:#21232b}.d{font-weight:500;font-size:16px;fill:#5a616e}@keyframes pop{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:no-preference){.s{opacity:0;animation:pop .5s ease forwards}}</style></defs><rect width="1000" height="400" rx="24" fill="url(#bg)"/><text class="t title" x="500" y="52" text-anchor="middle">Ce que provoque l'herbe à chat</text><g class="s"><rect x="60" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="120" cy="146" r="22" fill="url(#dot)"/><path d="M110 146 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="160" y="140">Flairer et lécher</text><text class="t d" x="160" y="170">le chat approche la plante</text></g><g class="s"><rect x="520" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="580" cy="146" r="22" fill="url(#dot)"/><path d="M570 146 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="620" y="140">Frottements</text><text class="t d" x="620" y="170">joues et menton contre l'objet</text></g><g class="s"><rect x="60" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="120" cy="284" r="22" fill="url(#dot)"/><path d="M110 284 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="160" y="278">Roulades</text><text class="t d" x="160" y="308">il se roule sur le dos, excité</text></g><g class="s"><rect x="520" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/><circle cx="580" cy="284" r="22" fill="url(#dot)"/><path d="M570 284 l7 8 l14 -16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="t h" x="620" y="278">Retour au calme</text><text class="t d" x="620" y="308">l'effet retombe vite</text></g><text class="t" x="880" y="384" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text></svg>