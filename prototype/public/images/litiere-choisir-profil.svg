<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Laquelle choisir selon votre situation : l'agglomérante est le choix polyvalent, idéal au quotidien et pour un budget maîtrisé ; la silice convient si vous cherchez surtout le contrôle des odeurs ou si vous vous absentez plusieurs jours. Dans tous les cas, on part d'une version fine et non parfumée.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#9350e0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b14bd6"/><stop offset="1" stop-color="#c98a4b"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .tag{font-weight:800;font-size:18px;fill:#fff;}
      .h{font-weight:800;font-size:19px;fill:#21232b;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.r{animation-delay:.2s}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="50" text-anchor="middle">Laquelle choisir selon votre situation</text>

  <g class="s">
    <rect x="60" y="82" width="880" height="82" rx="16" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <rect x="76" y="98" width="150" height="50" rx="12" fill="url(#a)"/><text class="t tag" x="151" y="129" text-anchor="middle">Agglomérante</text>
    <text class="t h" x="250" y="122">Le choix polyvalent</text>
    <text class="t d" x="250" y="148">Quotidien, budget maîtrisé, convient au plus grand nombre</text>
  </g>
  <g class="s r">
    <rect x="60" y="178" width="880" height="82" rx="16" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <rect x="76" y="194" width="150" height="50" rx="12" fill="url(#b)"/><text class="t tag" x="151" y="225" text-anchor="middle">Silice</text>
    <text class="t h" x="250" y="218">Odeurs et absences</text>
    <text class="t d" x="250" y="244">Priorité au contrôle des odeurs ou absences de plusieurs jours</text>
  </g>

  <text class="t d" x="500" y="294" text-anchor="middle" fill="#8b6b3f">Dans les deux cas : on part d'une version fine et non parfumée.</text>
  <text class="t" x="880" y="312" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
