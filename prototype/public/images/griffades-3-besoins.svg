<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Pourquoi les chats griffent : trois besoins naturels, entretenir ses griffes en retirant la gaine morte, s'étirer le dos et les épaules, et marquer son territoire par l'odeur et la trace visuelle.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:30px;fill:#21232b;}
      .h{font-weight:800;font-size:21px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){
        .s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}
      }
    </style>
  </defs>
  <rect width="1000" height="340" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="54" text-anchor="middle">Pourquoi les chats griffent : 3 besoins</text>

  <g class="s" transform="translate(180,170)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/>
    <path d="M-16 -18 L-16 16 M-4 -22 L-4 14 M8 -20 L8 15 M20 -14 L20 12" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text class="t h" x="0" y="82" text-anchor="middle">Entretenir ses griffes</text>
    <text class="t d" x="0" y="110" text-anchor="middle">Retirer la gaine morte</text>
  </g>
  <g class="s b" transform="translate(500,170)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/>
    <path d="M-22 14 Q0 -30 22 14" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-22" cy="14" r="5" fill="#fff"/><circle cx="22" cy="14" r="5" fill="#fff"/>
    <text class="t h" x="0" y="82" text-anchor="middle">S'étirer</text>
    <text class="t d" x="0" y="110" text-anchor="middle">Tout le dos et les épaules</text>
  </g>
  <g class="s c" transform="translate(820,170)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/>
    <circle cx="0" cy="-2" r="16" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M0 14 L0 24 M-14 6 L-22 12 M14 6 L22 12" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text class="t h" x="0" y="82" text-anchor="middle">Marquer son territoire</text>
    <text class="t d" x="0" y="110" text-anchor="middle">Odeur + trace visible</text>
  </g>

  <text class="t" x="500" y="320" font-size="16" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
