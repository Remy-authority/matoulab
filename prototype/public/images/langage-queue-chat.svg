<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="La queue du chat en 4 messages : dressée signifie content, gonflée signifie peur, qui fouette signifie agacé, enroulée signifie prudent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:32px;fill:#21232b;}
      .name{font-weight:700;font-size:20px;fill:#21232b;}
      .tail{fill:none;stroke:#6d4bd6;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;}
      @keyframes draw{from{opacity:0}to{opacity:1}}
      /* Contenu visible par défaut ; animation seulement si supportée + souhaitée. */
      @media (prefers-reduced-motion: no-preference){
        .col{opacity:0;animation:draw .5s ease forwards;}
        .k2{animation-delay:.15s}.k3{animation-delay:.30s}.k4{animation-delay:.45s}
      }
    </style>
  </defs>
  <rect width="1000" height="440" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="56" text-anchor="middle">La queue du chat en 4 messages</text>

  <!-- Dressée = Content -->
  <g class="col">
    <path class="tail" d="M140 260 L140 165 Q140 140 162 152"/>
    <text class="t name" x="140" y="315" text-anchor="middle">Dressée</text>
    <text class="t" x="140" y="345" text-anchor="middle" font-weight="800" font-size="19" fill="#2f7a5e">Content</text>
  </g>

  <!-- Gonflée = Peur -->
  <g class="col k2">
    <path d="M380 262 C 352 232, 352 176, 380 146 C 408 176, 408 232, 380 262 Z" fill="#6d4bd6"/>
    <path d="M366 176 l-12 -8 M372 158 l-10 -11 M394 176 l12 -8 M388 158 l10 -11" stroke="#b7a6ff" stroke-width="4" stroke-linecap="round"/>
    <text class="t name" x="380" y="315" text-anchor="middle">Gonflée</text>
    <text class="t" x="380" y="345" text-anchor="middle" font-weight="800" font-size="19" fill="#e07a5f">Peur</text>
  </g>

  <!-- Qui fouette = Agacé -->
  <g class="col k3">
    <path class="tail" d="M575 205 C 606 162, 634 248, 665 205"/>
    <text class="t name" x="620" y="315" text-anchor="middle">Qui fouette</text>
    <text class="t" x="620" y="345" text-anchor="middle" font-weight="800" font-size="19" fill="#c98a4b">Agacé</text>
  </g>

  <!-- Enroulée = Prudent -->
  <g class="col k4">
    <path class="tail" d="M860 262 L860 200 C 860 168 824 168 824 200 C 824 222 848 222 846 202"/>
    <text class="t name" x="860" y="315" text-anchor="middle">Enroulée</text>
    <text class="t" x="860" y="345" text-anchor="middle" font-weight="800" font-size="19" fill="#6a7180">Prudent</text>
  </g>

  <text class="t" x="500" y="410" font-size="18" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
