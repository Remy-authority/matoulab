<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Trois choses à savoir sur le ronronnement du chat : il commence tout petit, dès la tétée avec sa mère ; il s'adresse surtout à un interlocuteur, la mère puis l'humain ; et associé à des signes de mal-être, il justifie un avis vétérinaire.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .n{font-weight:800;font-size:26px;fill:#fff;}
      .h{font-weight:800;font-size:19px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:15px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}}
    </style>
  </defs>
  <rect width="1000" height="330" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Le ronronnement en 3 vérités</text>

  <g class="s" transform="translate(180,160)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/><text class="t n" x="0" y="9" text-anchor="middle">1</text>
    <text class="t h" x="0" y="80" text-anchor="middle">Très tôt</text>
    <text class="t d" x="0" y="106" text-anchor="middle">Dès la tétée, avec la mère</text>
  </g>
  <g class="s b" transform="translate(500,160)">
    <circle cx="0" cy="0" r="46" fill="url(#ic)"/><text class="t n" x="0" y="9" text-anchor="middle">2</text>
    <text class="t h" x="0" y="80" text-anchor="middle">Un message</text>
    <text class="t d" x="0" y="106" text-anchor="middle">Adressé à la mère, puis à nous</text>
  </g>
  <g class="s c" transform="translate(820,160)">
    <circle cx="0" cy="0" r="46" fill="#c98a4b"/><text class="t n" x="0" y="9" text-anchor="middle">3</text>
    <text class="t h" x="0" y="80" text-anchor="middle">À surveiller</text>
    <text class="t d" x="0" y="106" text-anchor="middle">Ronron + mal-être : véto</text>
  </g>

  <text class="t" x="880" y="314" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
