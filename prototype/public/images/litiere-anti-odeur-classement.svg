<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Contrôle des odeurs selon le type de litière, du meilleur au moins bon : la silice en cristaux est la plus performante, suivie de l'agglomérante de qualité, puis de la végétale dont le résultat varie selon les gammes, et enfin de la minérale non agglomérante la moins efficace.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .lbl{font-weight:800;font-size:18px;fill:#21232b;}
      .d{font-weight:500;font-size:14px;fill:#5a616e;}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @media (prefers-reduced-motion: no-preference){.b{transform-origin:340px 0;opacity:0;animation:grow .7s ease forwards}.b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}}
    </style>
  </defs>
  <rect width="1000" height="360" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="50" text-anchor="middle">Contrôle des odeurs par type de litière</text>

  <text class="t lbl" x="325" y="108" text-anchor="end">Silice</text>
  <g class="b"><rect x="340" y="90" width="560" height="30" rx="8" fill="url(#bar)"/></g>
  <text class="t d" x="910" y="111" text-anchor="start" fill="#4a2fa8">le plus performant</text>

  <text class="t lbl" x="325" y="168" text-anchor="end">Agglomérante</text>
  <g class="b b2"><rect x="340" y="150" width="450" height="30" rx="8" fill="url(#bar)"/></g>
  <text class="t d" x="800" y="171" text-anchor="start">si retirée chaque jour</text>

  <text class="t lbl" x="325" y="228" text-anchor="end">Végétale</text>
  <g class="b b3"><rect x="340" y="210" width="320" height="30" rx="8" fill="url(#bar)"/></g>
  <text class="t d" x="670" y="231" text-anchor="start">variable selon les gammes</text>

  <text class="t lbl" x="325" y="288" text-anchor="end">Minérale non agglo.</text>
  <g class="b b4"><rect x="340" y="270" width="180" height="30" rx="8" fill="#c9b8f5"/></g>
  <text class="t d" x="530" y="291" text-anchor="start">le moins efficace</text>

  <text class="t d" x="500" y="338" text-anchor="middle" fill="#8b6b3f">Aucune litière ne remplace un bac propre et bien placé.</text>
  <text class="t" x="915" y="352" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
