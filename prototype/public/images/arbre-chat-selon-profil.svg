<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Quel arbre à chat selon le profil : pour un chaton, un modèle bas et sécurisé ; pour un adulte joueur, un grand arbre avec plusieurs niveaux ; pour un chat âgé, un accès facile avec des paliers rapprochés ; en petit appartement, un modèle compact ou mural.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .h{font-weight:800;font-size:18px;fill:#4a2fa8;}
      .d{font-weight:500;font-size:15px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.15s}.c{animation-delay:.3s}.e{animation-delay:.45s}}
    </style>
  </defs>
  <rect width="1000" height="360" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Quel arbre selon votre chat</text>

  <g class="s" transform="translate(160,170)"><circle cx="0" cy="0" r="52" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Chaton</text><text class="t d" x="0" y="86" text-anchor="middle">Bas et sécurisé,</text><text class="t d" x="0" y="106" text-anchor="middle">paliers proches</text></g>
  <g class="s b" transform="translate(390,170)"><circle cx="0" cy="0" r="52" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Adulte</text><text class="t d" x="0" y="86" text-anchor="middle">Grand, plusieurs</text><text class="t d" x="0" y="106" text-anchor="middle">niveaux, un hamac</text></g>
  <g class="s c" transform="translate(620,170)"><circle cx="0" cy="0" r="52" fill="url(#ic)"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Senior</text><text class="t d" x="0" y="86" text-anchor="middle">Accès facile,</text><text class="t d" x="0" y="106" text-anchor="middle">marches basses</text></g>
  <g class="s e" transform="translate(850,170)"><circle cx="0" cy="0" r="52" fill="#c98a4b"/><text class="t h" x="0" y="6" text-anchor="middle" fill="#fff">Petit</text><text class="t d" x="0" y="86" text-anchor="middle">Compact ou</text><text class="t d" x="0" y="106" text-anchor="middle">mural, en hauteur</text></g>

  <text class="t" x="880" y="344" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
