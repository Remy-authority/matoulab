<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Les erreurs de nettoyage de la litière à éviter : les produits très parfumés qui rebutent le chat, la javel non rincée qui est irritante, un nettoyage trop espacé, et garder un bac rayé ou trop vieux qui retient les odeurs.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf5f5"/><stop offset="1" stop-color="#fdf7f0"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .h{font-weight:800;font-size:20px;fill:#21232b;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      .x{stroke:#fff;stroke-width:4;stroke-linecap:round;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.15s}.c{animation-delay:.3s}.e{animation-delay:.45s}}
    </style>
  </defs>
  <rect width="1000" height="430" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Nettoyage : les erreurs à éviter</text>

  <g class="s">
    <rect x="60" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#f2dcdc" stroke-width="2"/>
    <circle cx="120" cy="146" r="22" fill="#d9645f"/><path class="x" d="M112 138 l16 16 M128 138 l-16 16"/>
    <text class="t h" x="160" y="140">Produit très parfumé</text><text class="t d" x="160" y="170">L'odeur forte fait fuir le chat</text>
  </g>
  <g class="s b">
    <rect x="520" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#f2dcdc" stroke-width="2"/>
    <circle cx="580" cy="146" r="22" fill="#d9645f"/><path class="x" d="M572 138 l16 16 M588 138 l-16 16"/>
    <text class="t h" x="620" y="140">Javel non rincée</text><text class="t d" x="620" y="170">Irritante ; toujours bien rincer</text>
  </g>
  <g class="s c">
    <rect x="60" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#f2dcdc" stroke-width="2"/>
    <circle cx="120" cy="284" r="22" fill="#d9645f"/><path class="x" d="M112 276 l16 16 M128 276 l-16 16"/>
    <text class="t h" x="160" y="278">Nettoyage trop espacé</text><text class="t d" x="160" y="308">Un bac sale = première cause de rejet</text>
  </g>
  <g class="s e">
    <rect x="520" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#f2dcdc" stroke-width="2"/>
    <circle cx="580" cy="284" r="22" fill="#d9645f"/><path class="x" d="M572 276 l16 16 M588 276 l-16 16"/>
    <text class="t h" x="620" y="278">Garder un bac usé</text><text class="t d" x="620" y="308">Le plastique rayé retient les odeurs</text>
  </g>

  <text class="t d" x="500" y="392" text-anchor="middle" fill="#8b6b3f">Eau chaude et savon doux suffisent : simple, sans parfum, bien rincé.</text>
  <text class="t" x="880" y="416" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
