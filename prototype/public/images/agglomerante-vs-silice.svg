<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Litière agglomérante contre litière de silice. Agglomérante : forme des blocs faciles à retirer, entretien simple au quotidien, économique, texture fine appréciée. Silice : très absorbante, longue durée, bon contrôle des odeurs, moins de manipulation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#9350e0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b14bd6"/><stop offset="1" stop-color="#c98a4b"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .ch{font-weight:800;font-size:22px;fill:#fff;}
      .d{font-weight:600;font-size:16px;fill:#3a3f4a;}
      .vs{font-weight:800;font-size:24px;fill:#c98a4b;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.r{animation-delay:.2s}}
    </style>
  </defs>
  <rect width="1000" height="430" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="50" text-anchor="middle">Agglomérante ou silice ?</text>

  <g class="s">
    <rect x="60" y="78" width="400" height="316" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <rect x="60" y="78" width="400" height="52" rx="18" fill="url(#a)"/>
    <text class="t ch" x="260" y="112" text-anchor="middle">Agglomérante</text>
    <text class="t d" x="90" y="168">Blocs faciles à retirer</text>
    <text class="t d" x="90" y="210">Entretien simple au quotidien</text>
    <text class="t d" x="90" y="252">Économique</text>
    <text class="t d" x="90" y="294">Texture fine très appréciée</text>
    <text class="t d" x="90" y="346" fill="#8b6b3f">Point faible : poussière possible</text>
  </g>
  <g class="s r">
    <rect x="540" y="78" width="400" height="316" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <rect x="540" y="78" width="400" height="52" rx="18" fill="url(#b)"/>
    <text class="t ch" x="740" y="112" text-anchor="middle">Silice (cristaux)</text>
    <text class="t d" x="570" y="168">Très absorbante</text>
    <text class="t d" x="570" y="210">Longue durée entre 2 changements</text>
    <text class="t d" x="570" y="252">Bon contrôle des odeurs</text>
    <text class="t d" x="570" y="294">Moins de manipulation</text>
    <text class="t d" x="570" y="346" fill="#8b6b3f">Point faible : prix, texture parfois boudée</text>
  </g>
  <text class="t vs" x="500" y="245" text-anchor="middle">vs</text>

  <text class="t" x="880" y="418" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
