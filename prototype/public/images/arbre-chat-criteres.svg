<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Les 4 critères pour choisir un arbre à chat : la hauteur pour grimper et observer, la stabilité avec une base large et lestée, la matière avec du sisal pour griffer, et l'aménagement avec des plateformes et une cachette.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .n{font-weight:800;font-size:22px;fill:#fff;}
      .h{font-weight:800;font-size:20px;fill:#21232b;}
      .d{font-weight:500;font-size:16px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.15s}.c{animation-delay:.3s}.e{animation-delay:.45s}}
    </style>
  </defs>
  <rect width="1000" height="430" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Choisir un arbre à chat : 4 critères</text>

  <g class="s">
    <rect x="60" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="120" cy="146" r="26" fill="url(#dot)"/><text class="t n" x="120" y="154" text-anchor="middle">1</text>
    <text class="t h" x="166" y="140">La hauteur</text><text class="t d" x="166" y="170">Pour grimper et observer d'en haut</text>
  </g>
  <g class="s b">
    <rect x="520" y="86" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="580" cy="146" r="26" fill="url(#dot)"/><text class="t n" x="580" y="154" text-anchor="middle">2</text>
    <text class="t h" x="626" y="140">La stabilité</text><text class="t d" x="626" y="170">Base large et lestée, ne bascule pas</text>
  </g>
  <g class="s c">
    <rect x="60" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="120" cy="284" r="26" fill="url(#dot)"/><text class="t n" x="120" y="292" text-anchor="middle">3</text>
    <text class="t h" x="166" y="278">La matière</text><text class="t d" x="166" y="308">Du sisal pour griffer, pas de la corde qui s'effiloche</text>
  </g>
  <g class="s e">
    <rect x="520" y="224" width="420" height="120" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="580" cy="284" r="26" fill="url(#dot)"/><text class="t n" x="580" y="292" text-anchor="middle">4</text>
    <text class="t h" x="626" y="278">L'aménagement</text><text class="t d" x="626" y="308">Plateformes, hamac et une cachette</text>
  </g>

  <text class="t d" x="500" y="392" text-anchor="middle" fill="#8b6b3f">Un arbre stable et haut = un chat qui l'adopte vraiment.</text>
  <text class="t" x="880" y="416" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
