<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Rediriger les griffades en 4 étapes : 1 choisir un bon griffoir vertical et stable, 2 le placer à côté de la zone griffée, 3 le rendre irrésistible avec de l'herbe-à-chat et du jeu, 4 protéger temporairement le canapé.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:30px;fill:#21232b;}
      .num{font-weight:800;font-size:28px;fill:#fff;}
      .h{font-weight:800;font-size:21px;fill:#21232b;}
      .d{font-weight:500;font-size:17px;fill:#5a616e;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){
        .s{opacity:0;animation:pop .5s ease forwards}
        .b{animation-delay:.15s}.c{animation-delay:.3s}.e{animation-delay:.45s}
      }
    </style>
  </defs>
  <rect width="1000" height="470" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Rediriger les griffades en 4 étapes</text>

  <g class="s">
    <rect x="60" y="90" width="420" height="140" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="120" cy="160" r="34" fill="url(#num)"/><text class="t num" x="120" y="170" text-anchor="middle">1</text>
    <text class="t h" x="176" y="145">Un bon griffoir</text>
    <text class="t d" x="176" y="173">Vertical, stable, plus haut</text>
    <text class="t d" x="176" y="196">que le chat étiré, en sisal</text>
  </g>
  <g class="s b">
    <rect x="520" y="90" width="420" height="140" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="580" cy="160" r="34" fill="url(#num)"/><text class="t num" x="580" y="170" text-anchor="middle">2</text>
    <text class="t h" x="636" y="145">Au bon endroit</text>
    <text class="t d" x="636" y="173">Juste à côté de la zone</text>
    <text class="t d" x="636" y="196">griffée, sur son passage</text>
  </g>
  <g class="s c">
    <rect x="60" y="248" width="420" height="140" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="120" cy="318" r="34" fill="url(#num)"/><text class="t num" x="120" y="328" text-anchor="middle">3</text>
    <text class="t h" x="176" y="303">Le rendre irrésistible</text>
    <text class="t d" x="176" y="331">Herbe-à-chat, jeu près du</text>
    <text class="t d" x="176" y="354">griffoir, félicitations</text>
  </g>
  <g class="s e">
    <rect x="520" y="248" width="420" height="140" rx="18" fill="#fff" stroke="#ece7fb" stroke-width="2"/>
    <circle cx="580" cy="318" r="34" fill="url(#num)"/><text class="t num" x="580" y="328" text-anchor="middle">4</text>
    <text class="t h" x="636" y="303">Protéger le canapé</text>
    <text class="t d" x="636" y="331">Protection lisse, le temps</text>
    <text class="t d" x="636" y="354">que l'habitude s'installe</text>
  </g>

  <text class="t d" x="500" y="440" text-anchor="middle" fill="#8b6b3f">Jamais de punition : on remplace, on ne réprime pas.</text>
  <text class="t" x="500" y="462" font-size="16" fill="#6a7180" text-anchor="middle">matoulab.com</text>
</svg>
