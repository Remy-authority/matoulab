<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Combien de temps laisser un chat seul : quelques heures ou une journée de travail sans souci s'il a tout ce qu'il faut ; jusqu'à 24 à 48 heures maximum pour un adulte autonome avec ressources en quantité ; au-delà, prévoir le passage quotidien d'une personne ou une garde.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#fdf5f0"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#b14bd6"/></linearGradient>
    <style>
      .t{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .title{font-weight:800;font-size:29px;fill:#21232b;}
      .k{font-weight:800;font-size:17px;fill:#fff;}
      .h{font-weight:700;font-size:15px;fill:#21232b;}
      .chev{stroke:#c98a4b;stroke-width:6;stroke-linecap:round;fill:none;}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion: no-preference){.s{opacity:0;animation:pop .5s ease forwards}.b{animation-delay:.2s}.c{animation-delay:.4s}}
    </style>
  </defs>
  <rect width="1000" height="330" rx="24" fill="url(#bg)"/>
  <text class="t title" x="500" y="52" text-anchor="middle">Combien de temps le laisser seul</text>

  <g class="s"><circle cx="200" cy="150" r="58" fill="url(#ic)"/><text class="t k" x="200" y="145" text-anchor="middle">Quelques</text><text class="t k" x="200" y="166" text-anchor="middle">heures</text><text class="t h" x="200" y="240" text-anchor="middle">Aucun souci</text><text class="t h" x="200" y="260" text-anchor="middle">si tout est pret</text></g>
  <path class="chev" d="M300 135 L330 150 L300 165"/>
  <g class="s b"><circle cx="500" cy="150" r="58" fill="url(#ic)"/><text class="t k" x="500" y="145" text-anchor="middle">24 a 48 h</text><text class="t k" x="500" y="166" text-anchor="middle">max</text><text class="t h" x="500" y="240" text-anchor="middle">Adulte autonome,</text><text class="t h" x="500" y="260" text-anchor="middle">ressources en quantite</text></g>
  <path class="chev" d="M600 135 L630 150 L600 165"/>
  <g class="s c"><circle cx="800" cy="150" r="58" fill="#c98a4b"/><text class="t k" x="800" y="145" text-anchor="middle">Au-dela</text><text class="t k" x="800" y="166" text-anchor="middle">= garde</text><text class="t h" x="800" y="240" text-anchor="middle">Passage quotidien</text><text class="t h" x="800" y="260" text-anchor="middle">ou pension</text></g>

  <text class="t" x="880" y="314" font-size="14" fill="#6a7180" text-anchor="end">matoulab.com</text>
</svg>
