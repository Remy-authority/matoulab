# Robot de publication Matoulab : 1 nouvel article, 3 fois par semaine, 100% automatique et gratuit.
# Ecrit + genere l'image via Gemini (offre gratuite), build Astro, deploie sur Cloudflare Pages,
# puis committe le nouvel article + la file de sujets pour l'execution suivante.
name: Matoulab auto-publish

on:
  # Feu vert donne par Remy le 2026-07-13 : drip automatique 3x/semaine.
  # Ne tournera reellement qu'une fois les 2 secrets ajoutes au depot
  # (GEMINI_API_KEY + CLOUDFLARE_API_TOKEN). Avant ca, un run echoue sans rien publier.
  schedule:
    - cron: "17 8 * * 1,3,5"  # lundi, mercredi, vendredi ~08:17 UTC
  workflow_dispatch: {} # + lancement manuel possible (onglet Actions -> Run workflow)

permissions:
  contents: write # pour re-committer l'article genere + la file mise a jour

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        run: npm install

      # Auto-diagnostic : valide que les 2 secrets sont presents ET acceptes par leurs API,
      # AVANT de generer/deployer. N'affiche JAMAIS la valeur des secrets (seulement leur longueur).
      # Objectif : si un run echoue, le log dit precisement quel secret cloche (ex: mal colle).
      - name: Verifier les secrets (Gemini + Cloudflare)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          fail=0
          if [ -z "$GEMINI_API_KEY" ]; then echo "❌ GEMINI_API_KEY absent ou vide"; fail=1; else echo "✅ GEMINI_API_KEY present (longueur ${#GEMINI_API_KEY})"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "❌ CLOUDFLARE_API_TOKEN absent ou vide"; fail=1; else echo "✅ CLOUDFLARE_API_TOKEN present (longueur ${#CLOUDFLARE_API_TOKEN})"; fi
          if [ -n "$GEMINI_API_KEY" ]; then
            g=$(curl -s -o /dev/null -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY")
            echo "Gemini API HTTP $g"
            if [ "$g" != "200" ]; then echo "❌ Cle Gemini refusee (HTTP $g) -> secret GEMINI_API_KEY invalide/mal colle"; fail=1; else echo "✅ Cle Gemini acceptee"; fi
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            c=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            if echo "$c" | grep -q '"status":"active"'; then echo "✅ Token Cloudflare actif"; else echo "❌ Token Cloudflare NON actif -> secret CLOUDFLARE_API_TOKEN invalide/mal colle"; fail=1; fi
          fi
          if [ "$fail" != "0" ]; then echo "STOP: un secret est manquant ou invalide (voir ci-dessus)."; exit 1; fi
          echo "Tous les secrets sont valides, on continue."

      - name: Generer, construire et deployer 1 article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2edbbf024d9440e907f5fd74d174d0d3"
        run: node scripts/auto-publish.mjs

      - name: Committer le nouvel article + la file
        run: |
          git config user.name "matoulab-bot"
          git config user.email "bot@matoulab.com"
          git add -A
          git commit -m "auto: nouvel article publie" || echo "rien a committer"
          git push
