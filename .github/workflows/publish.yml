# Robot de publication Matoulab : 1 nouvel article, 3 fois par semaine, 100% automatique et gratuit.
# Ecrit + genere l'image via Gemini (offre gratuite), build Astro, deploie sur Cloudflare Pages,
# puis committe le nouvel article + la file de sujets pour l'execution suivante.
name: Matoulab auto-publish

on:
  # Feu vert donne par Remy le 2026-07-13 : drip automatique 3x/semaine.
  # Ne tournera reellement qu'une fois les 2 secrets ajoutes au depot
  # (GEMINI_API_KEY + CLOUDFLARE_API_TOKEN). Avant ca, un run echoue sans rien publier.
  schedule:
    - cron: "17 8 * * 1,3,5"  # lundi, mercredi, vendredi ~08:17 UTC
  workflow_dispatch: {} # + lancement manuel possible (onglet Actions -> Run workflow)

permissions:
  contents: write # pour re-committer l'article genere + la file mise a jour

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        run: npm install

      # Auto-diagnostic : valide que les 2 secrets sont presents ET acceptes par leurs API,
      # AVANT de generer/deployer. N'affiche JAMAIS la valeur des secrets (seulement leur longueur).
      # Le resultat est ecrit DIRECTEMENT sur la page "Summary" du run (GITHUB_STEP_SUMMARY),
      # visible sans avoir a ouvrir le detail des etapes.
      - name: Verifier les secrets (Gemini + Cloudflare)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          say() { echo "$1"; echo "$1" >> "$S"; }
          say "## Diagnostic des secrets Matoulab"
          fail=0
          # 1. GEMINI_API_KEY present ?
          if [ -z "$GEMINI_API_KEY" ]; then say "- ❌ **GEMINI_API_KEY** absent ou vide dans les secrets du depot"; fail=1
          else
            say "- ✅ GEMINI_API_KEY present (longueur ${#GEMINI_API_KEY})"
            g=$(curl -s -o /dev/null -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY")
            if [ "$g" != "200" ]; then say "- ❌ **Cle Gemini refusee** (HTTP $g) : le secret GEMINI_API_KEY est invalide ou mal colle (espace/retour a la ligne, ou cle expiree)"; fail=1
            else say "- ✅ Cle Gemini acceptee par l'API (HTTP 200)"; fi
          fi
          # 2. CLOUDFLARE_API_TOKEN present ?
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then say "- ❌ **CLOUDFLARE_API_TOKEN** absent ou vide dans les secrets du depot"; fail=1
          else
            say "- ✅ CLOUDFLARE_API_TOKEN present (longueur ${#CLOUDFLARE_API_TOKEN})"
            if curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -q '"status":"active"'; then
              say "- ✅ Token Cloudflare actif"
            else say "- ❌ **Token Cloudflare non actif** : le secret CLOUDFLARE_API_TOKEN est invalide ou mal colle"; fail=1; fi
          fi
          if [ "$fail" != "0" ]; then
            say ""
            say "➡️ **Action** : dans GitHub, Settings → Secrets and variables → Actions, clique le secret marque ❌, **Update**, recolle la valeur (aucun espace avant/apres), puis relance le workflow."
            echo "STOP: un secret est manquant ou invalide."
            exit 1
          fi
          say ""
          say "✅ **Les 2 secrets sont valides.** Generation + deploiement en cours."

      - name: Generer, construire et deployer 1 article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2edbbf024d9440e907f5fd74d174d0d3"
        run: |
          set -o pipefail
          node scripts/auto-publish.mjs 2>&1 | tee /tmp/publish.log
          echo "PUBLISH_OK=1" >> "$GITHUB_ENV"

      # Si la generation/deploiement a echoue, on remonte les dernieres lignes sur la page Summary.
      - name: Rapport d'echec (generation/deploiement)
        if: failure() && env.PUBLISH_OK != '1'
        run: |
          S="$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/publish.log ]; then
            echo "## ❌ Echec a l'etape generation/deploiement" >> "$S"
            echo "Les secrets sont valides mais le robot a echoue. Dernieres lignes du log :" >> "$S"
            echo '```' >> "$S"
            tail -25 /tmp/publish.log >> "$S"
            echo '```' >> "$S"
          fi

      - name: Committer le nouvel article + la file
        run: |
          git config user.name "matoulab-bot"
          git config user.email "bot@matoulab.com"
          git add -A
          git commit -m "auto: nouvel article publie" || echo "rien a committer"
          git push
