# Robot de publication Matoulab : 1 article, 3 fois par semaine, pris dans les brouillons ecrits d'avance
# (content/drafts/, relance du 27/09/2026). Couverture par fal.ai (Gemini ne fabrique plus d'images),
# controle visuel par Gemini, build Astro, deploiement Cloudflare Pages, verification en ligne, journal
# (tasks/journal-publication.tsv), puis commit de l'article et du brouillon consomme.
# Script IDENTIQUE dans les depots matoulab et reptilab : prototype/scripts/auto-publish.mjs
name: Matoulab auto-publish

on:
  schedule:
    - cron: "17 8 * * 1,3,5"  # lundi, mercredi, vendredi ~08:17 UTC
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Essai a blanc (1 = rien publie)"
        required: false
        default: "0"
      deployonly:
        description: "Remise en ligne sans nouvel article (1 = build + deploiement seulement)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4.x exige Node >= 22

      - name: Installer les dependances
        run: npm install

      # Valide les secrets AVANT de generer ; n'affiche jamais leur valeur. Resultat sur la page Summary.
      - name: Verifier les secrets (fal.ai + Cloudflare, Gemini facultatif)
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          say() { echo "$1"; echo "$1" >> "$S"; }
          say "## Diagnostic des secrets Matoulab"
          fail=0
          if [ -z "$FAL_KEY" ]; then say "- ❌ **FAL_KEY** absent"; fail=1
          else
            b=$(curl -s -w " %{http_code}" https://rest.alpha.fal.ai/billing/user_balance -H "Authorization: Key $FAL_KEY")
            if [ "${b##* }" != "200" ]; then say "- ❌ **FAL_KEY refusee** (HTTP ${b##* })"; fail=1; else say "- ✅ fal.ai accepte, solde ${b% *} $"; fi
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then say "- ❌ **CLOUDFLARE_API_TOKEN** absent"; fail=1
          elif curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | grep -q '"status":"active"'; then say "- ✅ Token Cloudflare actif"
          else say "- ❌ **Token Cloudflare non actif**"; fail=1; fi
          g=$(curl -s -o /dev/null -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY")
          if [ "$g" = "200" ]; then say "- ✅ Gemini accepte (controle des couvertures)"; else say "- ⚠️ Gemini refuse (HTTP $g) : couvertures publiees sans controle visuel"; fi
          [ "$fail" = "0" ] || { echo "STOP: un secret est manquant ou invalide."; exit 1; }

      - name: Publier 1 article (premier brouillon)
        env:
          SITE: matoulab
          DRYRUN: ${{ github.event.inputs.dryrun == '1' && '1' || '0' }}
          DEPLOY_ONLY: ${{ github.event.inputs.deployonly == '1' && '1' || '0' }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2edbbf024d9440e907f5fd74d174d0d3"
        run: node scripts/auto-publish.mjs

      - name: Committer l'article, le brouillon consomme et le journal
        if: github.event.inputs.dryrun != '1' && github.event.inputs.deployonly != '1'
        working-directory: .
        run: |
          git config user.name "matoulab-bot"
          git config user.email "bot@matoulab.com"
          git add -A
          git commit -m "auto: nouvel article publie" || { echo "rien a committer"; exit 0; }
          git pull --rebase --autostash
          git push
