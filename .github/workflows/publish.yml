# Robot de publication Matoulab : 1 nouvel article, 3 fois par semaine, 100% automatique et gratuit.
# Ecrit + genere l'image via Gemini (offre gratuite), build Astro, deploie sur Cloudflare Pages,
# puis committe le nouvel article + la file de sujets pour l'execution suivante.
name: Matoulab auto-publish

on:
  # Planning AUTOMATIQUE desactive par defaut : rien ne se publie sans le feu vert de Remy.
  # Pour activer le drip 3x/semaine, decommenter le bloc schedule ci-dessous
  # (et avoir ajoute les 2 secrets GEMINI_API_KEY + CLOUDFLARE_API_TOKEN dans le depot).
  # schedule:
  #   - cron: "17 8 * * 1,3,5"  # lundi, mercredi, vendredi
  workflow_dispatch: {} # lancement MANUEL uniquement pour l'instant

permissions:
  contents: write # pour re-committer l'article genere + la file mise a jour

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dependances
        run: npm install

      - name: Generer, construire et deployer 1 article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2edbbf024d9440e907f5fd74d174d0d3"
        run: node scripts/auto-publish.mjs

      - name: Committer le nouvel article + la file
        run: |
          git config user.name "matoulab-bot"
          git config user.email "bot@matoulab.com"
          git add -A
          git commit -m "auto: nouvel article publie" || echo "rien a committer"
          git push
